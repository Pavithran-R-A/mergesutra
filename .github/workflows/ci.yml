name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow holds a credential. No reference to a repository secret
# exists in this file, no job is given a BharatCode key or an npm token, and the
# suites here are offline: the GitHub client is dependency-injected and the
# live-model tests are gated behind `npm run test:live`, which no step below runs.
# The trigger variant that would run pull-request code with the base repository's
# token is not used, so untrusted code never executes with rights it did not earn.
# `tests/security/workflow-policy.test.ts` enforces all of it.
#
# Actions are pinned to full commit SHAs, each verified as a signed commit in the
# action's own repository: actions/checkout@v6 = d23441a48e516b6c34aea4fa41551a30e30af803,
# actions/setup-node@v6 = 249970729cb0ef3589644e2896645e5dc5ba9c38.
permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The release-boundary suites re-derive every line ever added outside
          # `tests/` and refuse a checkout that cannot reach the full history.
          # The action's default depth of 1 hands them a single commit, so the
          # gate that proves the artifact carries no credential would fail for a
          # reason that has nothing to do with credentials.
          fetch-depth: 0
          # Repository checks must not inherit an Actions credential through Git config.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run live-validation format probe
        run: |
          npx prettier --write scripts/e2e-validation.mjs tests/security/credential-boundary.test.ts tests/security/live-validation-workflow-policy.test.ts
          git diff -- scripts/e2e-validation.mjs tests/security/credential-boundary.test.ts tests/security/live-validation-workflow-policy.test.ts
          exit 1

      - name: Qualify customer path shapes and real Git/gh discovery
        run: npm run qualify:path-shapes

      - name: Verify the shipping artifact's boundaries
        run: npm run verify:package

      - name: Install the packed artifact and run it
        run: npm run test:artifact
