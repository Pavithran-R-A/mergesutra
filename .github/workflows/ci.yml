name: CI

on:
  push:
    branches: [main]
  pull_request:

# Normal CI never uses BharatCode secrets and never calls the live API.
# Tests are fully offline (dependency-injected fetch + fixtures).

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Run all deterministic gates
        run: npm run check
