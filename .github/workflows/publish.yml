name: Publish npm package

on:
  release:
    types: [published]

# Publishing uses npm Trusted Publishing (OIDC), never a long-lived npm token.
# The package must be linked to this exact workflow in npm's Trusted Publisher
# settings after the first package version exists. Until then, a release whose
# version is already on npm is verified rather than republished.
permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run all deterministic gates
        run: npm run check

      - name: Verify the shipping artifact's boundaries
        run: npm run verify:package

      - name: Install the packed artifact and run it
        run: npm run test:artifact

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-tag.mjs

      - name: Publish or verify the exact public version
        run: node scripts/publish-or-verify.mjs
