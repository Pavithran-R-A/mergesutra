name: Controlled live validation

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the credential-bound BharatCode validation after the no-key matrix
        required: true
        default: false
        type: boolean
      model:
        description: BharatCode model (Qwen for students/Lite/Pro; DeepSeek requires Pro; live /models check is authoritative)
        required: true
        default: qwen-3.8-27b
        type: choice
        options:
          - qwen-3.8-27b
          - deepseek-v4.1-flash
# This workflow never runs on pull requests or pushes. Ordinary CI owns untrusted
# code. A person must dispatch it deliberately. The live job additionally refuses
# to run unless the selected ref is main.
permissions:
  contents: read

jobs:
  no-key-chain:
    name: no-key chain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    env:
      NO_COLOR: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Walk the credential-free fixture chain
        # The trusted driver reads a public GitHub issue through gh. Repository
        # commands run as separate children and strip GH_TOKEN before execution.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/e2e-validation.mjs no-key

      - name: Upload sanitized no-key evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: no-key-${{ matrix.os }}-${{ github.run_id }}
          path: .mergesutra/live-validation-export/
          if-no-files-found: ignore
          retention-days: 14

  live-model:
    name: real BharatCode E2E
    needs: no-key-chain
    if: github.ref == 'refs/heads/main' && inputs.run_live == true
    runs-on: ubuntu-latest
    # The driver enforces its own 25-minute deadline on model work. This wider job
    # ceiling covers the install, build, digest preload and no-spend boundary proof
    # that must all finish before the first model request is allowed to start.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NO_COLOR: '1'
      # The image and engine the product's repository runner must use. The proof step
      # below preloads and measures this same digest; a repository command never runs
      # on the host, and never sees the model credential.
      MERGESUTRA_SANDBOX_IMAGE: node@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
      MERGESUTRA_DOCKER_EXECUTABLE: /usr/bin/docker
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Refuse an unconfigured secret without printing it
        shell: bash
        env:
          BHARATCODE_API_KEY: ${{ secrets.BHARATCODE_API_KEY }}
        run: |
          if [ -z "${BHARATCODE_API_KEY:-}" ]; then
            echo "BHARATCODE_API_KEY repository secret is not configured." >&2
            exit 78
          fi

      - name: Refuse a workflow re-run before any credentialed request
        shell: bash
        # GitHub keeps `GITHUB_RUN_ID` across a re-run and hands every attempt a brand new
        # ephemeral machine, so the request ledger configured below is empty at the start of
        # attempt 2. The count is therefore enforced *inside* an attempt, and the attempt
        # itself is what is refused here — refused before the catalog call, so a re-run spends
        # nothing at all, not even an authenticated read. No new temporary directory is
        # offered as proof that a budget survived a re-run: it did not survive one.
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT:-unset}" != "1" ]; then
            echo "GITHUB_RUN_ATTEMPT is ${GITHUB_RUN_ATTEMPT:-unset}, not 1." >&2
            echo "a re-run is given a fresh runner, so its request ledger starts empty and would hand this" >&2
            echo "same run another full ceiling of model requests. The budget is enforced within an attempt;" >&2
            echo "the attempt is refused. No credentialed request was sent." >&2
            exit 78
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the configured Docker engine answers
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$MERGESUTRA_DOCKER_EXECUTABLE" ]; then
            echo "the configured Docker executable is not an executable file: $MERGESUTRA_DOCKER_EXECUTABLE" >&2
            echo "no model request was sent" >&2
            exit 78
          fi
          if ! server_version="$("$MERGESUTRA_DOCKER_EXECUTABLE" version --format '{{ .Server.Version }}' 2>/dev/null)"; then
            echo "the Docker daemon did not answer 'docker version'; no model request was sent" >&2
            exit 78
          fi
          if [ -z "$server_version" ]; then
            echo "the Docker daemon returned an empty version; no model request was sent" >&2
            exit 78
          fi
          echo "docker daemon version: $server_version"

      - name: Preload the sandbox image by immutable digest
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$MERGESUTRA_SANDBOX_IMAGE" =~ ^node@sha256:[0-9a-f]{64}$ ]]; then
            echo "the sandbox image is not digest-pinned: $MERGESUTRA_SANDBOX_IMAGE" >&2
            echo "no model request was sent" >&2
            exit 78
          fi
          "$MERGESUTRA_DOCKER_EXECUTABLE" pull "$MERGESUTRA_SANDBOX_IMAGE"
          # The sandbox starts with --pull=never, so this is the only fetch. Reading the
          # resolved image back proves the named digest is the content on disk.
          "$MERGESUTRA_DOCKER_EXECUTABLE" image inspect --format 'resolved {{ .Id }}' "$MERGESUTRA_SANDBOX_IMAGE"

      - name: Prove the sandbox boundary without a model call
        shell: bash
        env:
          MERGESUTRA_RUNTIME_PROOF_IMAGE: node@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
          MERGESUTRA_RUNTIME_PROOF_DOCKER: /usr/bin/docker
        run: node scripts/sandbox-runtime-proof.mjs

      - name: Verify selected model is in the authenticated catalog
        shell: bash
        env:
          BHARATCODE_API_KEY: ${{ secrets.BHARATCODE_API_KEY }}
          BHARATCODE_MODEL: ${{ inputs.model }}
        run: |
          node <<'NODE'
          const key = process.env.BHARATCODE_API_KEY;
          const model = process.env.BHARATCODE_MODEL;
          const response = await fetch('https://bharatcode.ai/api/model/v1/models', {
            headers: {
              authorization: `Bearer ${key}`,
              accept: 'application/json',
            },
          });
          console.log(`BharatCode /models HTTP ${response.status}`);
          if (!response.ok) process.exit(78);
          const body = await response.json();
          const ids = (body.data ?? []).map((entry) => entry.id);
          console.log(`Catalog models: ${ids.join(', ') || '<none>'}`);
          if (!ids.includes(model)) process.exit(79);
          NODE

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Re-run deterministic release gates
        run: npm run check

      - name: Run the bounded real-model chain
        # Only this trusted driver can use gh for GitHub API reads. All install,
        # build, audit, deterministic tests and sandbox proofs run token-free.
        # Workspace-facing children are given a stripped environment by the driver.
        env:
          GH_TOKEN: ${{ github.token }}
          BHARATCODE_API_KEY: ${{ secrets.BHARATCODE_API_KEY }}
          BHARATCODE_MODEL: ${{ inputs.model }}
          # Below the transport's own ceiling, not above it. Node's fetch gives up at
          # ~300 s (UND_ERR_HEADERS_TIMEOUT) on any request whose response headers have
          # not arrived. Whether a completion sends those headers only once the answer is
          # whole is an inference, not a reading: run 39460563729 filled that step in
          # 304.5 s with a network failure while this said 540000, but its preserved trail
          # carries no UND_ERR_HEADERS_TIMEOUT code, so a slow answer and a silent endpoint
          # cannot be told apart from it. Sitting under the bound makes the failure name
          # the budget actually reached. The driver still runs the chain against the
          # 25-minute wall clock: it will not start a command once the clock is spent, and
          # gives every command no more than the time left on it.
          BHARATCODE_TIMEOUT_MS: '290000'
          BHARATCODE_MAX_RETRIES: '0'
          # The chain's hard pre-request ceiling, enforced by the client before a byte leaves
          # the process rather than read back off the stage records afterwards. It is the same
          # number the post-run qualification rules measure against, and the driver refuses to
          # start if the two ever disagree. `MAX_MODEL_COMPLETIONS` is 12.
          BHARATCODE_MAX_COMPLETION_REQUESTS: '12'
          # One absolute directory under the runner's own temporary path, which is private to
          # this job's machine and is not the workspace the model under review writes into.
          # The driver validates it before the first child starts — absolute, inside
          # RUNNER_TEMP, a real directory rather than a link, writable, honouring exclusive
          # create — and refuses to send anything if it fails. Nothing deletes or resets the
          # markers in it: a spent slot stays spent, including for a request that then died.
          BHARATCODE_REQUEST_LEDGER: ${{ runner.temp }}/mergesutra-request-ledger
        run: node scripts/e2e-validation.mjs live

      - name: Upload sanitized live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-model-${{ github.run_id }}
          path: .mergesutra/live-validation-export/
          if-no-files-found: ignore
          retention-days: 14
