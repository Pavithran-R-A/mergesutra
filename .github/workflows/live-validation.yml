name: Controlled live validation

on:
  push:
    branches: [ops/live-validation-once]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the credential-bound BharatCode validation after the no-key matrix
        required: true
        default: false
        type: boolean
# This workflow never runs on pull requests. Manual dispatch on main remains the
# normal path. This temporary ops branch can run exactly one live validation when
# the triggering commit carries [live-model-once]; the branch is cleaned after
# evidence collection.
permissions:
  contents: read

jobs:
  no-key-chain:
    name: no-key chain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Walk the credential-free fixture chain
        run: node scripts/e2e-validation.mjs no-key

      - name: Upload sanitized no-key evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: no-key-${{ matrix.os }}-${{ github.run_id }}
          path: .mergesutra/live-validation-export/
          if-no-files-found: ignore
          retention-days: 14

  live-model:
    name: real BharatCode E2E
    needs: no-key-chain
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.run_live == true) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/ops/live-validation-once' &&
       contains(github.event.head_commit.message, '[live-model-once]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Refuse an unconfigured secret without printing it
        shell: bash
        env:
          BHARATCODE_API_KEY: ${{ secrets.BHARATCODE_API_KEY }}
        run: |
          if [ -z "${BHARATCODE_API_KEY:-}" ]; then
            echo "BHARATCODE_API_KEY repository secret is not configured." >&2
            exit 78
          fi

      - name: Preflight BharatCode catalog and minimal generation
        shell: bash
        env:
          BHARATCODE_API_KEY: ${{ secrets.BHARATCODE_API_KEY }}
          BHARATCODE_MODEL: qwen-3.8-27b
        run: |
          node <<'NODE'
          const key = process.env.BHARATCODE_API_KEY;
          const model = process.env.BHARATCODE_MODEL;
          const base = 'https://bharatcode.ai/api/model/v1';
          const headers = {
            authorization: `Bearer ${key}`,
            'content-type': 'application/json',
            accept: 'application/json',
          };
          const redact = (text) =>
            String(text)
              .replace(/bc_live_[A-Za-z0-9_-]{8,}/g, '[REDACTED]')
              .replace(/sk-[A-Za-z0-9_-]{8,}/g, '[REDACTED]')
              .slice(0, 300);

          const models = await fetch(`${base}/models`, { headers });
          console.log(`BharatCode /models HTTP ${models.status}`);
          if (!models.ok) process.exit(78);
          const catalog = await models.json();
          const ids = (catalog.data ?? []).map((entry) => entry.id);
          console.log(`Catalog models: ${ids.join(', ') || '<none>'}`);
          if (!ids.includes(model)) process.exit(79);

          const chat = await fetch(`${base}/chat/completions`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
              model,
              messages: [{ role: 'user', content: 'Reply with exactly OK.' }],
              temperature: 0,
              max_tokens: 8,
            }),
          });
          console.log(`BharatCode /chat/completions HTTP ${chat.status}`);
          const body = await chat.text();
          if (!chat.ok) {
            let safe = '<no safe error message>';
            try {
              const parsed = JSON.parse(body);
              const candidate =
                parsed?.error?.message ??
                parsed?.detail ??
                parsed?.message ??
                (typeof parsed?.error === 'string' ? parsed.error : undefined);
              if (candidate) safe = redact(candidate);
            } catch {}
            console.error(`BharatCode generation error: ${safe}`);
            process.exit(80);
          }
          const parsed = JSON.parse(body);
          console.log(
            `Minimal generation accepted: model=${parsed.model ?? model}; finish=${parsed.choices?.[0]?.finish_reason ?? '<none>'}; content_chars=${String(parsed.choices?.[0]?.message?.content ?? '').length}`,
          );
          NODE

      - name: Install
        run: npm ci

      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Re-run deterministic release gates
        run: npm run check

      - name: Run the bounded real-model chain
        env:
          BHARATCODE_API_KEY: ${{ secrets.BHARATCODE_API_KEY }}
          BHARATCODE_MODEL: qwen-3.8-27b
        run: node scripts/e2e-validation.mjs live

      - name: Upload sanitized live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-model-${{ github.run_id }}
          path: .mergesutra/live-validation-export/
          if-no-files-found: ignore
          retention-days: 14
